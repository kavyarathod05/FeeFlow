# FeeFlow Render Blueprint
# Frontend can stay on Vercel; set VITE_API_BASE_URL to this API after deploy.
services:
  - type: web
    name: feeflow-api
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20.18.0"
      - key: DATABASE_URL
        fromDatabase:
          name: feeflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      # Update CORS_ORIGIN to your real Vercel URL after claim/deploy
      - key: CORS_ORIGIN
        value: "*"
      - key: APP_BASE_URL
        value: https://feeflow-api.onrender.com
      - key: API_BASE_URL
        value: https://feeflow-api.onrender.com
      - key: OTP_DEMO_MODE
        value: "true"
      - key: OTP_DEMO_CODE
        value: "246810"
      - key: OTP_EXPIRY_MINUTES
        value: "5"
      - key: OTP_MAX_ATTEMPTS
        value: "5"
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: GST_RATE
        value: "0.18"
      - key: TZ
        value: Asia/Kolkata

databases:
  # Free Postgres may be unavailable for new accounts — use lowest paid Basic plan.
  - name: feeflow-db
    plan: basic-256mb
    region: oregon
    databaseName: feeflow
    user: feeflow
    diskSizeGB: 1
